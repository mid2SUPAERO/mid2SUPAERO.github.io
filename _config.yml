title: Prof. Joseph Morlier
description: >-
  Home of the MID2 research group at ISAE-SUPAERO.
email: joseph.morlier@isae-supaero.fr


# --- Theme -------------------------------------------------------------
# "minima" base theme, restyled by assets/css/style.scss and _layouts/.
theme: minima
minima:
  skin: classic

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - about.md
  - books.md
  - team.md
  - research.md
  - software.md
  - teaching.md
  - readings.md
  - LearnwithAI.md

# --- Author / social -----------------------------------------------------
author:
  name: Joseph Morlier
  affiliation: ISAE-SUPAERO, Toulouse, France

markdown: kramdown


exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
